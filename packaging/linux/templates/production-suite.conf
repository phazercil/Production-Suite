# Production Suite screens, written by the Production Suite installer (packaging/linux/install.sh).
# Apache serves the screens' files itself and passes everything else to the suite on this server
# (127.0.0.1:8008, never reachable from the network). Only the plant network may open it: see
# production-suite-allow.inc, kept in step with Operator Kiosk > Admin > Network.
@LISTEN@
<VirtualHost *:@PORT@>
    ServerName @HOSTNAME@

    # The suite trusts the visitor's address only as Apache reports it: drop whatever a client sent.
    RequestHeader unset X-Forwarded-For early
    RequestHeader set X-Forwarded-Proto "@PROTO@"
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120

    Alias /static/ /var/www/production-suite/static/
    <Directory /var/www/production-suite/static>
        Options -Indexes
        <RequireAny>
            Include conf.d/production-suite-allow.inc
        </RequireAny>
    </Directory>
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8008/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8008/

    <Location />
        <RequireAny>
            Include conf.d/production-suite-allow.inc
        </RequireAny>
    </Location>
@SSL@
    ErrorLog logs/production-suite-error.log
    CustomLog logs/production-suite-access.log combined
</VirtualHost>
