<form method="post" class="sv-filter">{% csrf_token %}<input type="hidden" name="action" value="pmSave">{% if x %}<input type="hidden" name="id" value="{{ x.id }}">{% endif %}
  <label>Machine<select name="machine" required>{% with sel=x.machine|default:form.machine|default:machine %}<option value="">Pick…</option>{% for m in machines %}<option {% if m == sel %}selected{% endif %}>{{ m }}</option>{% endfor %}{% for m in other %}<option {% if m == sel %}selected{% endif %}>{{ m }}</option>{% endfor %}{% endwith %}</select></label>
  <label style="flex:1 1 260px">Task<input type="text" name="title" maxlength="120" required placeholder="e.g. Grease the pleater chain" value="{{ x.title|default:form.title|default:'' }}"></label>
  <label>Every<input type="number" name="every" min="0" step="any" required style="width:110px" value="{% if x %}{{ x.every|floatformat:'-2' }}{% else %}{{ form.every|default:'' }}{% endif %}"></label>
  <label>Of<select name="unit">{% with sel=x.unit|default:form.unit|default:"days" %}{% for k, l in units %}<option value="{{ k }}" {% if k == sel %}selected{% endif %}>{{ l }}</option>{% endfor %}{% endwith %}</select></label>
  <label>Priority<select name="priority">{% with sel=x.priority|default:form.priority|default:"Medium" %}{% for k in "Low,Medium,High"|split %}<option {% if k == sel %}selected{% endif %}>{{ k }}</option>{% endfor %}{% endwith %}</select></label>
  <label>Last done <small>(optional)</small><input type="date" name="lastDone"></label>
  <label class="chk"><input type="checkbox" name="active" value="1" {% if not x or x.active %}checked{% endif %}> Active</label>
  <label style="flex:1 1 100%">Steps <small>(one per line)</small><textarea name="steps" rows="3" maxlength="4000" style="font:500 14px var(--s-body);color:var(--s-ink);background:var(--s-ground,#111);border:1px solid var(--s-rule);border-radius:8px;padding:8px 10px">{{ x.steps|default:form.steps|default:'' }}</textarea></label>
  <button class="btn go">{% if x %}Save{% else %}Add task{% endif %}</button>{% if x %}<a class="btn ghost" href="?tab=pm{% if machine %}&amp;m={{ machine|urlencode }}{% endif %}">Cancel</a>{% endif %}
</form>{% if x %}<form method="post" style="margin-top:8px">{% csrf_token %}<input type="hidden" name="action" value="pmDelete"><input type="hidden" name="id" value="{{ x.id }}"><button class="btn bad po" type="submit">Remove this task</button> <span class="note">Its open request is removed too; what was done stays in PM history.</span></form>{% endif %}
