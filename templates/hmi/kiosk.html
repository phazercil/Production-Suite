{% extends "base.html" %}{% load static %}
{% block title %}Operator Kiosk{% endblock %}
{% block head %}<link rel="stylesheet" href="{% static 'hmi/kiosk.css' %}">{% if station_lock %}<meta name="station-lock" content="{{ station_lock }}">{% endif %}{% endblock %}
{% block content %}
<div class="mbody">
<div class="app">
  <aside class="rail">
    <button class="ibtn" data-action="toggleNav" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="ibtn" data-action="alarms" aria-label="Alarms" id="alarmBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E06C5B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 22 20H2Z"/><path d="M12 10v4M12 17h.01" stroke-linecap="round"/></svg>
      <span class="alarmcount" id="alarmCount"></span>
    </button>
    <div class="spacer"></div>
    <button class="login" data-action="login" id="loginBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#A7AFB8" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span id="loginLabel">Log in</span>
    </button>
  </aside>
  <nav class="nav" id="nav" aria-label="Operator pages"></nav>
  <main>
    <div class="banner" id="banner"></div>
    <section id="view" style="display:flex;flex-direction:column;gap:16px;min-width:0"></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'hmi/kiosk.js' %}"></script>{% endblock %}
