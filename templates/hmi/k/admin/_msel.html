{# A picker of tables or columns for one machine field. Shows a saved value that isn't in the list ("not found" once the list is known). #}<select name="v" {% if not S.is_admin %}disabled{% endif %} hx-post="/kiosk/do/mdSet" hx-trigger="change" hx-vals='{"id": "{{ c.m.name|escapejs }}", "f": "{{ f }}"}' hx-params="id,f,v" hx-target="#mc-{{ c.m.pk }}" hx-swap="outerHTML">{% if blank %}<option value="" {% if not val %}selected{% endif %}>{{ blank }}</option>{% endif %}{% if val and val not in opts %}<option value="{{ val }}" selected>{{ val }}{% if opts %} (not found){% endif %}</option>{% endif %}{% for o in opts %}<option value="{{ o }}" {% if o == val %}selected{% endif %}>{{ o }}</option>{% endfor %}</select>
