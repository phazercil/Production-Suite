{% for L in A.lists %}<div class="panel"><div class="row"><h2 class="h2 grow">{{ L.title }}</h2><span class="note">{{ L.items|length }} items</span></div>{% if L.help %}<p class="sub" style="margin-top:4px">{{ L.help }}</p>{% endif %}
  <div class="ledit">{% for v in L.items %}<div class="lrow"><span class="num note">{{ forloop.counter }}</span><input type="text" name="v" value="{{ v }}" {% if not S.perms.lists_edit %}disabled{% endif %} hx-post="/kiosk/do/run" hx-trigger="change" hx-vals='{"c": "listSet", "k": "{{ L.k }}", "i:n": "{{ forloop.counter0 }}"}' hx-params="c,k,i:n,v" aria-label="{{ L.title }} {{ forloop.counter }}">
    {% if S.perms.lists_edit %}<button class="btn ghost sm" hx-post="/kiosk/do/run" hx-vals='{"c": "listMove", "k": "{{ L.k }}", "i:n": "{{ forloop.counter0 }}", "d:n": "-1"}' hx-params="c,k,i:n,d:n" aria-label="Move up" {% if forloop.first %}disabled{% endif %}>↑</button><button class="btn ghost sm" hx-post="/kiosk/do/run" hx-vals='{"c": "listMove", "k": "{{ L.k }}", "i:n": "{{ forloop.counter0 }}", "d:n": "1"}' hx-params="c,k,i:n,d:n" aria-label="Move down" {% if forloop.last %}disabled{% endif %}>↓</button><button class="btn ghost sm" hx-post="/kiosk/do/run" hx-vals='{"c": "listDel", "k": "{{ L.k }}", "i:n": "{{ forloop.counter0 }}"}' hx-params="c,k,i:n" aria-label="Remove">✕</button>{% endif %}</div>{% endfor %}</div>
  {% if S.perms.lists_edit %}<form class="row" style="margin-top:10px" hx-post="/kiosk/do/run" hx-swap="none"><input type="hidden" name="c" value="listAdd"><input type="hidden" name="k" value="{{ L.k }}"><input type="text" name="v" placeholder="Add a new item" style="flex:1;width:auto;min-width:0" aria-label="New item"><button class="btn primary" type="submit">Add</button></form>{% endif %}</div>
{% endfor %}
