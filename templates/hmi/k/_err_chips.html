{% if errs %}<div class="errchips">{% for e in errs|slice:max|default:errs %}<span class="errchip" title="{{ e.text|default:e.code }} · {{ e.start|plan:S.t }}{% if e.end and e.end != e.start %} – {{ e.end|plan:S.t }}{% elif not e.end %} – still showing{% endif %}">{{ e.code|default:e.text }}{% if e.code and e.text %} <span>{{ e.text }}</span>{% endif %}</span>{% endfor %}{% if errs|length > max_n %}<span class="note">+{{ errs|length|add:neg_max }} more</span>{% endif %}</div>{% endif %}
