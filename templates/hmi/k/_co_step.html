<label class="chk" style="align-items:flex-start"><input type="checkbox" name="step{{ st.i }}:b" value="1" {% if st.done %}checked{% endif %} hx-post="/kiosk/do/coStep" hx-trigger="change" hx-vals='{"i": "{{ st.i }}"}' hx-params="i,step{{ st.i }}:b"> <span class="num" style="color:var(--ink-2)">{{ forloop.counter }}</span>
  <span style="flex:1;min-width:0">{% if st.caution %}<span style="color:var(--bad);font-weight:700">⚠ {{ st.caution }}</span><br>{% endif %}<span>{{ st.text|linebreaksbr }}</span>{% if st.tag %}<span class="pill warn" style="margin-left:6px">{{ st.tag }}</span>{% endif %}{% if st.asset %}<span class="note"> · {{ st.asset }}</span>{% endif %}{% if st.detail %}<br><span class="note">{{ st.detail }}</span>{% endif %}{% if st.whoDone %}<br><span class="note">✓ {{ st.whoDone }}</span>{% endif %}
    {% if st.m %}<span class="co-media" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">{% for m in st.m %}{% if m.kind == "image" %}<a href="/instructions/media/{{ m.pk }}" target="_blank" rel="noopener"><img src="/instructions/media/{{ m.pk }}?size=thumb" alt="{{ m.name }}" loading="lazy" style="height:96px;border-radius:6px;border:1px solid var(--line)"></a>{% else %}<video src="/instructions/media/{{ m.pk }}" controls preload="metadata" playsinline style="max-height:200px;max-width:100%;border-radius:6px;background:#000"></video>{% endif %}{% endfor %}</span>{% endif %}</span>
  {% if st.imageOk %}<a class="btn ghost sm" href="{{ st.image }}" target="_blank" rel="noopener">Photo</a>{% endif %}</label>
