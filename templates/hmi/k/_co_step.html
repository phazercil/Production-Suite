<label class="chk" style="align-items:flex-start"><input type="checkbox" name="step{{ st.i }}:b" value="1" {% if st.done %}checked{% endif %} hx-post="/kiosk/do/coStep" hx-trigger="change" hx-vals='{"i": "{{ st.i }}"}' hx-params="i,step{{ st.i }}:b"> <span class="num" style="color:var(--ink-2)">{{ forloop.counter }}</span>
  <span style="flex:1;min-width:0"><span>{{ st.text }}</span>{% if st.tag %}<span class="pill warn" style="margin-left:6px">{{ st.tag }}</span>{% endif %}{% if st.asset %}<span class="note"> · {{ st.asset }}</span>{% endif %}{% if st.detail %}<br><span class="note">{{ st.detail }}</span>{% endif %}{% if st.whoDone %}<br><span class="note">✓ {{ st.whoDone }}</span>{% endif %}</span>
  {% if st.imageOk %}<a class="btn ghost sm" href="{{ st.image }}" target="_blank" rel="noopener">Photo</a>{% endif %}</label>
