<tr data-wi-row><td><input name="p_name" maxlength="80" value="{{ p.name|default:'' }}" placeholder="e.g. Screw height"></td><td><input name="p_desc" maxlength="200" value="{{ p.desc|default:'' }}" placeholder="e.g. 1mm above pleat height"></td>
  <td><input name="p_target" data-wi-formula maxlength="200" value="{{ p.target|default:'' }}" placeholder="31.5 or [Pleat height (mm)] + 1"></td><td><input name="p_min" data-wi-formula maxlength="200" value="{{ p.min|default:'' }}"></td><td><input name="p_max" data-wi-formula maxlength="200" value="{{ p.max|default:'' }}"></td><td><input name="p_unit" maxlength="20" value="{{ p.unit|default:'' }}" placeholder="mm"></td>
  <td class="wi-row-tools"><button type="button" class="btn bad sm" data-wi-remove title="Remove this parameter" aria-label="Remove parameter">✕</button></td></tr>
