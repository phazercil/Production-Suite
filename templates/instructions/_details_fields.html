{% load suite %}      <label class="wide">Title<input name="title" required maxlength="160" value="{{ x.title }}"></label>
      <label>Kind<select name="kind">{% for k, l in kinds %}<option value="{{ k }}" {% if k == x.kind %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
      <label>Parts<input name="parts" maxlength="400" value="{{ x.parts }}"></label>
      <label class="wide">Show when <small>(only for filters where this is true, from the filter's data in the 3D viewer, e.g. <code>[Side A thickness (mm)] = 2</code> or <code>[Side bands] = 1 and [Media type] = "carbon"</code>; blank: every filter. Needed for a special note card)</small><input name="condition" data-wi-formula maxlength="400" value="{{ x.condition }}" placeholder="[Side A thickness (mm)] = 2"></label>
      <label class="wide">Not for filters where <small>(an exclusion: it doesn't show for filters where this is true, e.g. <code>[Side bands] = 0</code>)</small><input name="exclude" data-wi-formula maxlength="400" value="{{ x.exclude }}" placeholder="[Side bands] = 0"></label>
      <label class="wide">Except parts <small>(never for these part numbers, comma-separated, * for any)</small><input name="except_parts" maxlength="400" value="{{ x.except_parts }}" placeholder="MG4062HP, AQ12*"></label>
      <label class="wide">Insert variable<select data-wi-var><option value="">Pick the filter's data…</option>{% regroup allvars by group as groups %}{% for g in groups %}<optgroup label="{{ g.grouper }}">{% for v in g.list %}<option value="{{ v.name }}">{{ v.name }}{% if v.type and v.type != "number" %} ({{ v.type }}){% endif %}</option>{% endfor %}</optgroup>{% endfor %}</select></label>
      <label class="wide">Also read <small>(other instructions to read with this one: WI numbers, comma-separated)</small><input name="see_also" maxlength="200" value="{{ x.see_also }}" placeholder="WI-004, WI-007"></label>
      <fieldset class="wide"><legend>Machines <small>(none: every machine)</small></legend>{% for m in machines %}<label class="chk"><input type="checkbox" name="machines" value="{{ m.pk }}" {% if m.pk in mids %}checked{% endif %}> {{ m.name }}</label>{% endfor %}</fieldset>
      <label class="chk"><input type="hidden" name="active" value="0"><input type="checkbox" name="active" value="1" {% if x.active %}checked{% endif %}> In use (untick to withdraw it from the kiosks)</label>
