<div class="wi-edit-step" data-wi-row><span class="wi-n">{{ i|add:1 }}</span>
  <div class="wi-edit-body"><textarea name="s_text" rows="3" maxlength="4000" placeholder="What to do">{{ s.text|default:"" }}</textarea>
    <input name="s_caution" maxlength="500" value="{{ s.caution|default:'' }}" placeholder="Caution (optional): shown in red above the step">
    {% if media %}<div class="wi-pick">{% for m in media %}<label class="wi-pm" title="{{ m.name }}"><input type="checkbox" name="s_media_{{ i }}" data-wi-media value="{{ m.pk }}" {% if s and m.pk in s.media %}checked{% endif %}>
      {% if m.kind == "image" %}<img src="/instructions/media/{{ m.pk }}?size=thumb" alt="">{% else %}<span class="wi-vid">▶ {{ m.name|truncatechars:18 }}</span>{% endif %}</label>{% endfor %}</div>{% endif %}
  </div>
  <div class="wi-row-tools"><button type="button" class="btn ghost sm" data-wi-up title="Move up" aria-label="Move step up">↑</button><button type="button" class="btn ghost sm" data-wi-down title="Move down" aria-label="Move step down">↓</button><button type="button" class="btn ghost sm" data-wi-insert title="Add a step below this one" aria-label="Add a step below">+</button><button type="button" class="btn bad sm" data-wi-remove title="Remove this step" aria-label="Remove step">✕</button></div></div>
