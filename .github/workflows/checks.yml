# The tests, on every pull request that isn't a draft (once: not again on main after merging, since the
# pull request already ran them). Kept small to save Actions minutes. The installer, Windows and Linux install
# checks are in install-checks.yml and run only when packaging files change; a release builds both anyway.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # what the installer puts on servers
          cache: pip
      - name: Install the same packages the servers get
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links packaging/wheels -r requirements-windows.txt
      - name: Django checks
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Screen scripts have no syntax errors
        run: |
          set -e
          for f in $(git ls-files 'static/**/*.js' 'labor/**/*.js'); do node --check "$f"; done
      - name: Test suite
        run: python manage.py test tests --verbosity 1
