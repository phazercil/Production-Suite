# Runs on every pull request and every push to main. A pull request can only be merged into main
# when both jobs pass (branch protection on main).
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]   # the installer puts 3.12 on servers; 3.13 keeps the next one honest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the same packages the servers get
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links packaging/wheels -r requirements-windows.txt
      - name: Django checks
        run: python manage.py check
      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Test suite
        run: python manage.py test tests --verbosity 1

  package:
    name: Installer and screens
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Screen scripts have no syntax errors
        run: |
          set -e
          for f in $(git ls-files 'static/**/*.js' 'labor/**/*.js'); do node --check "$f"; done
      - name: PowerShell scripts parse (installer, updater window, admin program)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Installer zip builds (also checks the version numbers match)
        run: python packaging/build.py

  windows:
    name: Windows (signing and scheduled tasks)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sign a build with a test certificate, and register the scheduled tasks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\ci\windows-check.ps1
