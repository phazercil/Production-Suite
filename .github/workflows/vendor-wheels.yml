# Downloads the compiled wheels listed in packaging/wheels-binary.txt for every Python the installers can use
# (Windows: 3.10 to 3.14, 64-bit; Linux EL9: 3.11 and 3.12) and keeps them as a build artifact to commit into
# packaging/wheels. Runs when that list changes, or by hand.
name: Vendor wheels
on:
  workflow_dispatch:
  push:
    paths:
      - packaging/wheels-binary.txt
      - .github/workflows/vendor-wheels.yml
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download
        run: |
          set -e
          mkdir -p out
          reqs=$(grep -v '^\s*#' packaging/wheels-binary.txt | grep -v '^\s*$')
          for v in 310 311 312 313 314; do
            pip download $reqs --only-binary :all: --no-deps --platform win_amd64 --python-version $v --implementation cp -d out
          done
          for v in 311 312; do
            pip download $reqs --only-binary :all: --no-deps --platform manylinux_2_28_x86_64 --python-version $v --implementation cp -d out
          done
          ls -la out
          sha256sum out/* > out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: binary-wheels
          path: out/
