# Builds a signed release on a Windows machine: the installer zip and the update file, every .exe and
# PowerShell script code-signed with the company certificate. Start it from the Actions tab (Run workflow),
# or by pushing a tag like v1.3.5. Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CODESIGN_PFX_BASE64    the code-signing certificate (.pfx) as base64:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("codesign.pfx"))
#   CODESIGN_PFX_PASSWORD  its password
#   UPDATE_SIGNING_KEY     the whole production-suite-signing-key.txt (for the update file)
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's in this release (shown on Admin > Updates)"
        required: false
        default: ""
      packages:
        description: "Put the Python packages in the update file (only when requirements-windows.txt changed)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and sign
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTES: ${{ github.event.inputs.notes }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CODESIGN_PFX_BASE64) { throw "Add the CODESIGN_PFX_BASE64 and CODESIGN_PFX_PASSWORD secrets: releases are always code-signed." }
          if (-not $env:UPDATE_SIGNING_KEY) { throw "Add the UPDATE_SIGNING_KEY secret (the whole production-suite-signing-key.txt)." }
          $tmp = $env:RUNNER_TEMP
          $pfx = Join-Path $tmp "codesign.pfx"; $key = Join-Path $tmp "update-key.txt"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            Set-Content -Path $key -Value $env:UPDATE_SIGNING_KEY -Encoding ASCII
            $a = @("packaging/build.py", "--sign", "--pfx", $pfx, "--key", $key, "--notes", "$env:NOTES")
            if ($env:PACKAGES -eq "true") { $a += "--packages" }
            & python @a
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
          } finally { Remove-Item $pfx, $key -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: production-suite-release
          path: |
            dist/ProductionSuite-Setup.zip
            dist/ProductionSuite-Update-*.zip
          if-no-files-found: error
      - name: Attach to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ProductionSuite-Setup.zip dist/ProductionSuite-Update-*.zip --title "Production Suite ${GITHUB_REF_NAME}" --notes "Signed build. Install with Setup.exe, or upload the update file in Operator Kiosk > Admin > Updates."
