# Builds a signed release on a Windows machine: the installer zip and the update file, every .exe and
# PowerShell script code-signed with the company certificate. Start it from the Actions tab (Run workflow),
# or by pushing a tag like v1.3.5. Needs these repository secrets (Settings > Secrets and variables > Actions):
#   CODESIGN_PFX_BASE64    the code-signing certificate (.pfx) as base64:  [Convert]::ToBase64String([IO.File]::ReadAllBytes("codesign.pfx"))
#   CODESIGN_PFX_PASSWORD  its password
#   UPDATE_SIGNING_KEY     the whole production-suite-signing-key.txt (for the update file)
# The Linux package (ProductionSuite-Linux.tar.gz) is built on its own job and needs no secrets, so a tag always
# gets it; Linux servers install it straight from the release with packaging/linux/get.sh. When the
# UPDATE_SIGNING_KEY secret is set, that job also builds the Linux update file
# (ProductionSuite-Update-<version>-r<revision>-linux[-with-packages].zip) that Admin > Updates > Check for updates
# finds on a Linux server. It carries the Python packages when they changed since the previous release.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's in this release (shown on Admin > Updates)"
        required: false
        default: ""
      packages:
        description: "Put the Python packages in the update file (only when requirements-windows.txt changed)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and sign
        shell: powershell
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTES: ${{ github.event.inputs.notes }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CODESIGN_PFX_BASE64) { throw "Add the CODESIGN_PFX_BASE64 and CODESIGN_PFX_PASSWORD secrets: releases are always code-signed." }
          if (-not $env:UPDATE_SIGNING_KEY) { throw "Add the UPDATE_SIGNING_KEY secret (the whole production-suite-signing-key.txt)." }
          $tmp = $env:RUNNER_TEMP
          $pfx = Join-Path $tmp "codesign.pfx"; $key = Join-Path $tmp "update-key.txt"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
            Set-Content -Path $key -Value $env:UPDATE_SIGNING_KEY -Encoding ASCII
            $a = @("packaging/build.py", "--sign", "--pfx", $pfx, "--key", $key, "--notes", "$env:NOTES")
            if ($env:PACKAGES -eq "true") { $a += "--packages" }
            & python @a
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
          } finally { Remove-Item $pfx, $key -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: production-suite-release
          path: |
            dist/ProductionSuite-Setup.zip
            dist/ProductionSuite-Update-*.zip
          if-no-files-found: error
      - name: Attach to a GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Production Suite ${GITHUB_REF_NAME}" --notes-file packaging/release-notes.md || gh release view "${GITHUB_REF_NAME}" >/dev/null
          gh release upload "${GITHUB_REF_NAME}" dist/ProductionSuite-Setup.zip dist/ProductionSuite-Update-*.zip --clobber

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the previous release's tag: did the Python packages change since?
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Linux package
        run: |
          python packaging/build.py
          cd dist && sha256sum ProductionSuite-Linux.tar.gz > ProductionSuite-Linux.tar.gz.sha256 && cat ProductionSuite-Linux.tar.gz.sha256
      - name: Build the Linux update file (when the UPDATE_SIGNING_KEY secret is set)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          NOTES: ${{ github.event.inputs.notes }}
          PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::notice::No UPDATE_SIGNING_KEY secret: no Linux update file (Linux servers update with get.sh)."; exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          pk=()
          if [ "$PACKAGES" = "true" ] || [ -z "$prev" ] || ! git diff --quiet "$prev" HEAD -- requirements-windows.txt packaging/wheels; then
            pk=(--packages); echo "Python packages changed since ${prev:-the start}: the update file carries them."
          else
            echo "Python packages unchanged since $prev."
          fi
          key="$RUNNER_TEMP/update-key.txt"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          python packaging/build.py --linux-update --key "$key" "${pk[@]}" --notes "$NOTES"
      - uses: actions/upload-artifact@v4
        with:
          name: production-suite-linux
          path: |
            dist/ProductionSuite-Linux.tar.gz
            dist/ProductionSuite-Linux.tar.gz.sha256
            dist/ProductionSuite-Update-*-linux*.zip
          if-no-files-found: error
      - name: Attach to the GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Production Suite ${GITHUB_REF_NAME}" --notes-file packaging/release-notes.md || gh release view "${GITHUB_REF_NAME}" >/dev/null
          files=(dist/ProductionSuite-Linux.tar.gz dist/ProductionSuite-Linux.tar.gz.sha256)
          for f in dist/ProductionSuite-Update-*-linux*.zip; do [ -e "$f" ] && files+=("$f"); done
          # GitHub's upload sometimes answers 500: try again before giving up
          for i in 1 2 3; do gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber && exit 0; sleep $((i * 15)); done
          exit 1
